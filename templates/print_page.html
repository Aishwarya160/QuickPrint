<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Printing: {{ filename }}</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            z-index: 999999;
        }
    </style>
</head>
<body>

    <iframe id="print-frame" src="{{ file_url }}">
        Your browser doesn't support iframes. Please <a href="{{ file_url }}" target="_blank">click here</a> to open the document directly.
    </iframe>

    <script>
        // Get the iframe element by its ID
        const printFrame = document.getElementById('print-frame');

        // This function will execute ONLY after the content (PDF, image, etc.)
        // inside the iframe has completely finished loading.
        printFrame.onload = function() {
            try {
                // Set focus to the iframe's content
                printFrame.contentWindow.focus();
                // Call the print command on the iframe's content, not the parent window
                printFrame.contentWindow.print();
            } catch (error) {
                console.error("Could not trigger print dialog:", error);
                alert("Failed to open print preview. Please check your browser's pop-up settings.");
            }
        };

        // This function is called after the user interacts with the print dialog (prints or cancels)
        window.onafterprint = function() {
    // Tell Flask that printing is finished
    fetch("/mark_print_done/{{ req_id }}", {
        method: "POST"
    }).then(() => {
        // Optional: close the print tab
        window.close();
    });
};

    </script>

</body>
</html>
