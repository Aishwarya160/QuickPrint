{% extends "base.html" %}

{% block content %}

<!-- Main background (SAME as Student Login) -->
<div
  style="
    position: fixed;
    inset: 0;
    background: linear-gradient(
      135deg,
      #e9f2ff 0%,
      #f6f9ff 45%,
      #ffffff 100%
    );
    z-index: -3;
  "
></div>

<!-- Subtle blue glow (SAME as Student Login) -->
<div
  style="
    position: fixed;
    inset: 0;
    background:
      radial-gradient(
        circle at top right,
        rgba(13,110,253,0.18),
        transparent 55%
      ),
      radial-gradient(
        circle at bottom left,
        rgba(13,110,253,0.12),
        transparent 60%
      );
    z-index: -2;
  "
></div>

<!-- Login card -->
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="glass-card animate-fade-in-up"
         style="
           width: 100%;
           max-width: 420px;
           box-shadow: 0 25px 50px rgba(13,110,253,0.18);
         ">

        <h3 class="text-center mb-4">
            <i class="bi bi-person-workspace text-primary"></i> Staff Login
        </h3>

        <form method="POST" action="{{ url_for('staff_login') }}">
            <div class="mb-3">
                <label for="user_id" class="form-label">User ID</label>
                <input type="text" class="form-control" id="user_id" name="user_id"
                       placeholder="Enter your User ID" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       placeholder=" " name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                Login
            </button>
        </form>

        <p class="text-center text-muted small mt-3">
            🛠️ Secure access for staff members
        </p>

        <div class="text-center mt-2">
            <a href="{{ url_for('home') }}" class="text-decoration-none text-muted">
                <i class="bi bi-arrow-left-circle"></i> Back to Home
            </a>
        </div>
    </div>
</div>

{% endblock %}
