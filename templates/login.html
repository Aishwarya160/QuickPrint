{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="glass-card" style="width: 100%; max-width: 420px;">

        <h3 class="text-center mb-4">
            <i class="bi bi-person-fill text-primary"></i> Student Login
        </h3>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label class="form-label">USN</label>
                <input
                    type="text"
                    class="form-control"
                    name="user_id"
                    placeholder="Enter your USN"
                    required
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    autocomplete="off">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                Login
            </button>
        </form>

        <p class="text-center text-muted small mt-3">
            Secure access for submitting print requests
        </p>

        <div class="text-center mt-2">
            <a href="{{ url_for('home') }}" class="text-decoration-none text-muted">
                Back to Home
            </a>
        </div>

    </div>
</div>

{% endblock %}
