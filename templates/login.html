{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height:80vh;">
  <div class="glass-card" style="max-width:420px;width:100%;">

    <h3 class="text-center mb-4">Student Login</h3>

    <form method="POST" action="{{ url_for('login') }}" enctype="application/x-www-form-urlencoded">

      <div class="mb-3">
        <label class="form-label">USN</label>
        <input type="text"
               class="form-control"
               name="user_id"
               required
               autocomplete="off"
               autocapitalize="characters"
               spellcheck="false">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password"
               class="form-control"
               name="password"
               required
               autocomplete="off">
      </div>

      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

  </div>
</div>

{% endblock %}
